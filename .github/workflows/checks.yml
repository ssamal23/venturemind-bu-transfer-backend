name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Tests that need no database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Run the tests
        run: >
          python -m pytest -q -k "not end_to_end"
          tests/test_rules.py tests/test_gateway_failover.py tests/test_validators.py
          tests/test_startup_guard.py tests/test_embedded_worker.py tests/test_storage.py

  docker:
    name: Docker image builds and starts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: bu-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The app imports inside the image
        run: docker run --rm bu-api:ci python -c "import app.main, app.workers.evaluation_worker; print('image ok')"
      - name: The embedding model is baked in (no download at start)
        run: docker run --rm -e HF_HUB_OFFLINE=1 bu-api:ci python -c "from app.services.embeddings import FastEmbedder; print(len(FastEmbedder().embed(['hello'])[0]), 'dimensions')"
